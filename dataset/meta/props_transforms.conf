# props_transforms.conf — CCS CTF Dataset
# CIM field aliases for non-standard field names

# ============================================================
# Windows Security / Kerberos JSON
# ============================================================

[WinEventLog:Security]
SHOULD_LINEMERGE = false
KV_MODE = json
TIME_PREFIX = "TimeCreated":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%z
MAX_TIMESTAMP_LOOKAHEAD = 40

# CIM Authentication mappings (fields already pre-populated in JSON)
FIELDALIAS-auth-action   = action  AS result
FIELDALIAS-auth-src      = src     AS src_ip
FIELDALIAS-auth-dest     = dest    AS dest_host
FIELDALIAS-auth-user     = user    AS user_name

# ============================================================
# Sysmon JSON
# ============================================================

[XmlWinEventLog:Microsoft-Windows-Sysmon/Operational]
SHOULD_LINEMERGE = false
KV_MODE = json
TIME_PREFIX = "TimeCreated":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%z
MAX_TIMESTAMP_LOOKAHEAD = 40

# CIM Endpoint mappings
FIELDALIAS-sysmon-process     = Image        AS process
FIELDALIAS-sysmon-process_id  = ProcessId    AS process_id
FIELDALIAS-sysmon-parent      = ParentImage  AS parent_process
FIELDALIAS-sysmon-parent_id   = ParentProcessId AS parent_process_id
FIELDALIAS-sysmon-cmdline     = CommandLine  AS cmdline
FIELDALIAS-sysmon-dest        = Computer     AS dest
FIELDALIAS-sysmon-user        = User         AS user
FIELDALIAS-sysmon-file        = TargetFilename AS file_path
FIELDALIAS-sysmon-query       = QueryName    AS query
FIELDALIAS-sysmon-query_ans   = QueryResults AS answer
FIELDALIAS-sysmon-src_net     = SourceIp     AS src
FIELDALIAS-sysmon-dest_net    = DestinationIp AS dest_ip
FIELDALIAS-sysmon-reg_path    = TargetObject AS registry_path
FIELDALIAS-sysmon-reg_data    = Details      AS registry_value_data

# ============================================================
# Zeek / TA-bro (conn.log, dns.log, http.log, ssl.log)
# ============================================================
# TA-bro maps Zeek fields to CIM automatically using id.orig_h → src, etc.
# The following are supplementary aliases for any non-standard field names.

[bro:conn:json]
SHOULD_LINEMERGE = false
KV_MODE = none
INDEXED_EXTRACTIONS = tsv
FIELD_NAMES = ts,uid,id.orig_h,id.orig_p,id.resp_h,id.resp_p,proto,service,duration,orig_bytes,resp_bytes,conn_state,local_orig,local_resp,missed_bytes,history,orig_pkts,orig_ip_bytes,resp_pkts,resp_ip_bytes,tunnel_parents
FIELD_DELIM = \t
HEADER_MODE = none
TIMESTAMP_FIELDS = ts
TIME_FORMAT = %s.%6N

FIELDALIAS-conn-src       = id.orig_h  AS src
FIELDALIAS-conn-src_port  = id.orig_p  AS src_port
FIELDALIAS-conn-dest      = id.resp_h  AS dest
FIELDALIAS-conn-dest_port = id.resp_p  AS dest_port
FIELDALIAS-conn-bytes_in  = orig_bytes AS bytes_in
FIELDALIAS-conn-bytes_out = resp_bytes AS bytes_out
FIELDALIAS-conn-transport = proto      AS transport
FIELDALIAS-conn-action    = conn_state AS action

[bro:dns:json]
SHOULD_LINEMERGE = false
KV_MODE = none
INDEXED_EXTRACTIONS = tsv
FIELD_NAMES = ts,uid,id.orig_h,id.orig_p,id.resp_h,id.resp_p,proto,trans_id,rtt,query,qclass,qclass_name,qtype,qtype_name,rcode,rcode_name,AA,TC,RD,RA,Z,answers,TTLs,rejected
FIELD_DELIM = \t
HEADER_MODE = none
TIMESTAMP_FIELDS = ts
TIME_FORMAT = %s.%6N

FIELDALIAS-dns-src        = id.orig_h   AS src
FIELDALIAS-dns-dest       = id.resp_h   AS dest
FIELDALIAS-dns-query_type = qtype_name  AS query_type
FIELDALIAS-dns-answer     = answers     AS answer
FIELDALIAS-dns-message    = rcode_name  AS message_type

[bro:http:json]
SHOULD_LINEMERGE = false
KV_MODE = none
INDEXED_EXTRACTIONS = tsv
FIELD_NAMES = ts,uid,id.orig_h,id.orig_p,id.resp_h,id.resp_p,trans_depth,method,host,uri,referrer,version,user_agent,request_body_len,response_body_len,status_code,status_msg,info_code,info_msg,tags,username,password,proxied,original_mime_types,resp_mime_types
FIELD_DELIM = \t
HEADER_MODE = none
TIMESTAMP_FIELDS = ts
TIME_FORMAT = %s.%6N

FIELDALIAS-http-src         = id.orig_h          AS src
FIELDALIAS-http-dest        = id.resp_h          AS dest
FIELDALIAS-http-status      = status_code        AS status
FIELDALIAS-http-bytes_in    = request_body_len   AS bytes_in
FIELDALIAS-http-bytes_out   = response_body_len  AS bytes_out

[bro:ssl:json]
SHOULD_LINEMERGE = false
KV_MODE = none
INDEXED_EXTRACTIONS = tsv
FIELD_NAMES = ts,uid,id.orig_h,id.orig_p,id.resp_h,id.resp_p,version,cipher,curve,server_name,resumed,last_alert,next_protocol,established,cert_chain_fuids,client_cert_chain_fuids,subject,issuer,client_subject,client_issuer,validation_status,ja3,ja3s
FIELD_DELIM = \t
HEADER_MODE = none
TIMESTAMP_FIELDS = ts
TIME_FORMAT = %s.%6N

FIELDALIAS-ssl-src    = id.orig_h   AS src
FIELDALIAS-ssl-dest   = id.resp_h   AS dest
FIELDALIAS-ssl-sni    = server_name AS ssl_server_name

# ============================================================
# Firewall CSV (Cisco ASA-style)
# ============================================================

[cisco:asa:syslog]
SHOULD_LINEMERGE = false
KV_MODE = none
INDEXED_EXTRACTIONS = csv
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%z
TIMESTAMP_FIELDS = timestamp

FIELDALIAS-fw-src_ip    = src_ip   AS src
FIELDALIAS-fw-dest_ip   = dest_ip  AS dest
FIELDALIAS-fw-protocol  = protocol AS transport
