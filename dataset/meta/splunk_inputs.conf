# splunk_inputs.conf — CCS CTF Dataset
# Place in: $SPLUNK_HOME/etc/system/local/inputs.conf
# (or create as a custom app in $SPLUNK_HOME/etc/apps/ccs_ctf/local/)
#
# Set <BASE_PATH> to the absolute path of the ctf_dataset directory.

[monitor://<BASE_PATH>/host/windows_security.json]
disabled    = false
index       = ctf
sourcetype  = WinEventLog:Security
time_format = %Y-%m-%dT%H:%M:%S%z

[monitor://<BASE_PATH>/host/windows_kerberos.json]
disabled    = false
index       = ctf
sourcetype  = WinEventLog:Security
time_format = %Y-%m-%dT%H:%M:%S%z

[monitor://<BASE_PATH>/host/windows_system.json]
disabled    = false
index       = ctf
sourcetype  = WinEventLog:System
time_format = %Y-%m-%dT%H:%M:%S%z

[monitor://<BASE_PATH>/host/sysmon.json]
disabled    = false
index       = ctf
sourcetype  = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
time_format = %Y-%m-%dT%H:%M:%S%z

[monitor://<BASE_PATH>/network/conn.log]
disabled    = false
index       = ctf
sourcetype  = bro:conn:json

[monitor://<BASE_PATH>/network/dns.log]
disabled    = false
index       = ctf
sourcetype  = bro:dns:json

[monitor://<BASE_PATH>/network/http.log]
disabled    = false
index       = ctf
sourcetype  = bro:http:json

[monitor://<BASE_PATH>/network/ssl.log]
disabled    = false
index       = ctf
sourcetype  = bro:ssl:json

[monitor://<BASE_PATH>/firewall/firewall.csv]
disabled    = false
index       = ctf
sourcetype  = cisco:asa:syslog
time_format = %Y-%m-%dT%H:%M:%S%z
